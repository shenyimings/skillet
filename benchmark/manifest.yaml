# Benchmark ground truth. One row per directory in benchmark/corpus/.
#
# label_source records HOW a row was labelled so nothing is overclaimed:
#   dataset          verdict from MaliciousAgentSkillsBench; patterns reviewed by us
#   upstream_fixture verdict+patterns as intended by the fixture's author (SkillSpector)
#   case_study       payload published in a security write-up; labelled from that write-up
#   author_review    labelled by us for this benchmark
#
# Real public samples fetched by scripts/fetch_upstream.py are appended under the marker
# at the end of this file; everything above the marker is curated by hand.
version: 1
