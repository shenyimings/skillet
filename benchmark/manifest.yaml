  # --- Disclosed real payloads from published security write-ups --------------------
  - id: malicious-disclosed-allowedtools-revshell
    verdict: malicious
    patterns: [PE1, SC2]
    credential_patterns: [CM1]
    provenance: real_disclosed
    label_source: case_study
    source_url: https://labs.reversec.com/posts/2026/05/skill-issues-compromising-claude-code-with-malicious-skills-agents-part-1
    note: allowed-tools Bash(*) plus backtick socat reverse shell. Endpoint rewritten to TEST-NET-3 (203.0.113.0/24).
  - id: malicious-disclosed-bypass-npm-rce
    verdict: malicious
    patterns: [PE1, SC2]
    provenance: real_disclosed
